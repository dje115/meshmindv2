[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshmind-chunking"
version = "0.1.0"
description = "MeshMind v2 token-aware chunking for documents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/meshmind_chunking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
