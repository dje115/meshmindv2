[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshmind-worker-docproc"
version = "0.1.0"
description = "MeshMind v2 document processing worker"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "meshmind-worker-runtime",
    "pypdf>=5.0",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "striprtf>=0.0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "reportlab>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/meshmind_worker_docproc"]

[project.scripts]
meshmind-docproc = "meshmind_worker_docproc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
