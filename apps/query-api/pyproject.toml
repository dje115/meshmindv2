[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshmind-query-api"
version = "0.1.0"
description = "MeshMind v2 query layer: search, ask, documents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.29",
    "qdrant-client>=1.12",
    "httpx>=0.27",
    "pydantic>=2",
    "sentence-transformers>=3.0",
    "duckduckgo-search>=7.0",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.3"]

[project.scripts]
meshmind-query-api = "meshmind_query_api.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meshmind_query_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
