[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshmind-worker-runtime"
version = "0.1.0"
description = "MeshMind v2 shared worker framework"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/meshmind_worker_runtime"]
