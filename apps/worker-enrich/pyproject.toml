[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshmind-worker-enrich"
version = "0.1.0"
description = "MeshMind v2 chunking and enrichment worker"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "meshmind-worker-runtime",
    "meshmind-chunking",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/meshmind_worker_enrich"]

[project.scripts]
meshmind-enrich = "meshmind_worker_enrich.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
