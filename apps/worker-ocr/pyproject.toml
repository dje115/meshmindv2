[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshmind-worker-ocr"
version = "0.1.0"
description = "MeshMind v2 OCR worker for scanned PDFs and images"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "meshmind-worker-runtime",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "pypdf>=5.0",
    "pdf2image>=1.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "reportlab>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/meshmind_worker_ocr"]

[project.scripts]
meshmind-ocr = "meshmind_worker_ocr.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
