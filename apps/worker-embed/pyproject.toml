[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshmind-worker-embed"
version = "0.1.0"
description = "MeshMind v2 embeddings worker - vectors in Qdrant"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "meshmind-worker-runtime",
    "qdrant-client>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Optional: local embedding models
sentence-transformers = ["sentence-transformers>=2.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/meshmind_worker_embed"]

[project.scripts]
meshmind-embed = "meshmind_worker_embed.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
