[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshmind-worker-image"
version = "0.1.0"
description = "MeshMind v2 image processing worker"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "meshmind-worker-runtime",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/meshmind_worker_image"]

[project.scripts]
meshmind-image = "meshmind_worker_image.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
