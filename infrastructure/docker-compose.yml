# MeshMind v2 - Local development
# Run: docker compose -f infrastructure/docker-compose.yml up -d
# Infra-only: postgres, redis, qdrant, meilisearch
# Full stack: add control-api and web (build from repo root)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meshmind
      POSTGRES_PASSWORD: meshmind
      POSTGRES_DB: meshmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: dev-key-minimum-32-characters-long
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  control-api:
    build:
      context: ..
      dockerfile: apps/control-api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      CONTROL_API_PORT: "3000"
      DATABASE_URL: postgres://meshmind:meshmind@postgres:5432/meshmind
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - control-api

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  meilisearch_data:
